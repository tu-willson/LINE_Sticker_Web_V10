<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;padding:0;background:transparent;font-family:Arial,"Microsoft JhengHei",sans-serif}
#wrap{width:100%;box-sizing:border-box}
#canvas{display:block;width:100%;height:auto;cursor:default;border:1px solid #aaa;box-sizing:border-box}
#status{font-size:14px;padding:7px 0;color:#555}
#help{font-size:13px;color:#666;margin-bottom:6px}
</style>
</head>
<body>
<div id="wrap">
  <div id="help">拖曳框中央＝移動　｜　拖曳角落＝調整大小　｜　拖曳邊＝單方向調整</div>
  <canvas id="canvas"></canvas>
  <div id="status">正在載入裁切畫布…</div>
</div>

<script>
/*
  V10 STEP 10C.2
  完全不依賴外部 CDN / streamlit-component-lib。
  直接使用 Streamlit Custom Component v1 的 postMessage 協定。
*/

const C = document.getElementById("canvas");
const ctx = C.getContext("2d");
const statusEl = document.getElementById("status");

let args = null;
let img = new Image();
let boxes = [];
let iw = 1, ih = 1;
let scale = 1;
let active = -1;
let mode = null;
let start = null;
let snapshot = null;
let lastSent = "";

const colors = [
  "#ff4040","#3987ff","#32ad61","#a04bd0",
  "#ff922e","#25aeb0","#db3f9b","#956c3c"
];

function sendMessage(type, data) {
  const message = Object.assign({
    isStreamlitMessage: true,
    type: type
  }, data || {});
  window.parent.postMessage(message, "*");
}

function setComponentReady() {
  sendMessage("streamlit:componentReady", {apiVersion: 1});
}

function setFrameHeight(height) {
  if (!height) {
    height = document.documentElement.scrollHeight;
  }
  sendMessage("streamlit:setFrameHeight", {height: height});
}

function setComponentValue(value) {
  /*
    JSON serializable object.
    Streamlit v1 component protocol accepts JSON values.
  */
  sendMessage("streamlit:setComponentValue", {
    dataType: "json",
    value: value
  });
}

function cloneBoxes(b) {
  return (b || []).map(x => x.map(Number));
}

function clamp(v,a,b) {
  return Math.max(a, Math.min(b, v));
}

function defaultBoxes() {
  const out = [];
  for (let i=0; i<8; i++) {
    const c = i % 4;
    const r = Math.floor(i / 4);
    out.push([
      Math.round(c * iw / 4),
      Math.round(r * ih / 2),
      Math.round((c+1) * iw / 4),
      Math.round((r+1) * ih / 2)
    ]);
  }
  return out;
}

function resizeCanvas() {
  if (!iw || !ih) return;

  /*
    固定最大顯示寬度。
    原始座標永遠保留 iw × ih。
  */
  const maxW = Math.min(
    1100,
    Math.max(420, window.innerWidth || 900)
  );

  C.width = Math.round(maxW);
  C.height = Math.round(maxW * ih / iw);
  scale = C.width / iw;

  draw();
  setFrameHeight(document.documentElement.scrollHeight);
}

function loadImage() {
  img.onload = function() {
    iw = Number(args.image_width || img.naturalWidth);
    ih = Number(args.image_height || img.naturalHeight);

    boxes = cloneBoxes(args.boxes);

    if (!Array.isArray(boxes) || boxes.length !== 8) {
      boxes = defaultBoxes();
    }

    resizeCanvas();

    statusEl.textContent =
      "✅ 8 個裁切框已載入，可以直接用滑鼠拖曳。";
  };

  img.onerror = function() {
    statusEl.textContent =
      "❌ 裁切畫布無法載入原始圖片。";
  };

  img.src = "data:image/png;base64," + args.image_b64;
}

function draw() {
  if (!img.complete) return;

  ctx.clearRect(0,0,C.width,C.height);
  ctx.drawImage(img,0,0,C.width,C.height);

  for (let i=0; i<8; i++) {
    const b = boxes[i];

    const x = b[0] * scale;
    const y = b[1] * scale;
    const w = (b[2]-b[0]) * scale;
    const h = (b[3]-b[1]) * scale;

    ctx.save();

    ctx.strokeStyle = colors[i];
    ctx.lineWidth = 3;
    ctx.setLineDash([10,7]);
    ctx.strokeRect(x,y,w,h);
    ctx.setLineDash([]);

    const hs = 10;
    const pts = [
      [x,y],
      [x+w,y],
      [x,y+h],
      [x+w,y+h]
    ];

    ctx.fillStyle = colors[i];

    pts.forEach(p => {
      ctx.fillRect(
        p[0]-hs/2,
        p[1]-hs/2,
        hs,
        hs
      );
    });

    /*
      這個數字只是操作介面的識別標籤，
      不會寫回原始圖片，也不會進入裁切輸出。
    */
    ctx.font = "bold 16px Arial";
    ctx.fillStyle = colors[i];
    ctx.fillText(
      String(i+1).padStart(2,"0"),
      x+8,
      y+20
    );

    ctx.restore();
  }
}

function pointerPosition(e) {
  const r = C.getBoundingClientRect();

  return {
    x: (e.clientX-r.left) * (iw/r.width),
    y: (e.clientY-r.top) * (ih/r.height)
  };
}

function hitTest(p) {
  for (let i=7; i>=0; i--) {
    const b = boxes[i];
    const t = Math.max(12, 12/scale);

    const nearL = Math.abs(p.x-b[0]) <= t;
    const nearR = Math.abs(p.x-b[2]) <= t;
    const nearT = Math.abs(p.y-b[1]) <= t;
    const nearB = Math.abs(p.y-b[3]) <= t;

    const inside =
      p.x>=b[0] && p.x<=b[2] &&
      p.y>=b[1] && p.y<=b[3];

    if (nearL && nearT) return [i,"nw"];
    if (nearR && nearT) return [i,"ne"];
    if (nearL && nearB) return [i,"sw"];
    if (nearR && nearB) return [i,"se"];

    if (nearT && p.x>b[0] && p.x<b[2]) return [i,"n"];
    if (nearB && p.x>b[0] && p.x<b[2]) return [i,"s"];
    if (nearL && p.y>b[1] && p.y<b[3]) return [i,"w"];
    if (nearR && p.y>b[1] && p.y<b[3]) return [i,"e"];

    if (inside) return [i,"move"];
  }

  return [-1,null];
}

function sendBoxes() {
  const payload = {
    boxes: cloneBoxes(boxes)
  };

  const json = JSON.stringify(payload);

  if (json === lastSent) return;

  lastSent = json;
  setComponentValue(payload);
}

C.addEventListener("pointerdown", function(e) {
  e.preventDefault();

  try {
    C.setPointerCapture(e.pointerId);
  } catch (_) {}

  const p = pointerPosition(e);
  const h = hitTest(p);

  if (h[0] < 0) return;

  active = h[0];
  mode = h[1];
  start = p;
  snapshot = cloneBoxes(boxes);

  statusEl.textContent =
    "🖱️ 正在調整 " +
    String(active+1).padStart(2,"0") +
    "…";
});

C.addEventListener("pointermove", function(e) {
  if (active < 0) return;

  e.preventDefault();

  const p = pointerPosition(e);
  const b = snapshot[active];

  const dx = p.x-start.x;
  const dy = p.y-start.y;

  let n = [...b];

  const minW = Math.max(30, iw*0.02);
  const minH = Math.max(30, ih*0.02);

  if (mode === "move") {
    const w = b[2]-b[0];
    const h = b[3]-b[1];

    const x1 = clamp(b[0]+dx,0,iw-w);
    const y1 = clamp(b[1]+dy,0,ih-h);

    n = [
      x1,
      y1,
      x1+w,
      y1+h
    ];
  } else {
    if (mode.includes("w"))
      n[0] = clamp(
        b[0]+dx,
        0,
        b[2]-minW
      );

    if (mode.includes("e"))
      n[2] = clamp(
        b[2]+dx,
        b[0]+minW,
        iw
      );

    if (mode.includes("n"))
      n[1] = clamp(
        b[1]+dy,
        0,
        b[3]-minH
      );

    if (mode.includes("s"))
      n[3] = clamp(
        b[3]+dy,
        b[1]+minH,
        ih
      );
  }

  boxes[active] = n;
  draw();
});

C.addEventListener("pointerup", function(e) {
  if (active >= 0) {
    try {
      C.releasePointerCapture(e.pointerId);
    } catch (_) {}

    sendBoxes();
  }

  active = -1;
  mode = null;

  statusEl.textContent =
    "✅ 裁切框已更新";
});

C.addEventListener("pointercancel", function() {
  active = -1;
  mode = null;
});

window.addEventListener("resize", resizeCanvas);

function onRender(event) {
  if (!event.data) return;
  if (event.data.type !== "streamlit:render") return;

  args = event.data.args || {};
  loadImage();
}

window.addEventListener("message", onRender);

setComponentReady();

window.addEventListener("load", function() {
  setFrameHeight(document.documentElement.scrollHeight);
});
</script>
</body>
</html>
